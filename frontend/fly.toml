# SlideSmith web (Next.js) — deploy from this directory:
#   cd frontend && fly launch --no-deploy   # first time only
#   fly deploy
#
# API_INTERNAL_URL is baked at image build time (Next rewrites). Use the public
# API hostname so Fly Proxy can auto-start a scaled-to-zero API machine.
# Browser still calls same-origin /backend-api/* (session cookie stays on this host).

app = "slidesmith-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "/backend-api"
    # Public Fly URL of the API app (must match backend app name + /api path).
    API_INTERNAL_URL = "https://slidesmith-api.fly.dev/api"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOSTNAME = "::"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    # /login is public (middleware redirects / → /login when unauthenticated).
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
