# SlideSmith web (Next.js) — deploy from this directory:
#   cd frontend && fly launch --no-deploy   # first time only
#   fly deploy
#
# API_INTERNAL_URL is baked at image build time (Next rewrites). It must point at the
# Fly private DNS name of the backend app + its internal_port (see backend/fly.toml).

app = "slidesmith-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "/backend-api"
    # Must match backend app name + internal_port. Change if you rename the API app.
    API_INTERNAL_URL = "http://slidesmith-api.internal:8080/api"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOSTNAME = "::"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    # /login is public (middleware redirects / → /login when unauthenticated).
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
