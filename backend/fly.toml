# SlideSmith API — deploy from this directory:
#   cd backend && fly launch --no-deploy   # first time only (or fly apps create)
#   fly secrets set DATABASE_URL=… COOKIE_SECURE=true CORS_ALLOWED_ORIGINS=https://YOUR-WEB.fly.dev
#   fly deploy
#
# Rename `app` if the name is taken. Keep it in sync with frontend build arg API_INTERNAL_URL.

app = "slidesmith-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "::"
  COOKIE_SAMESITE = "lax"
  SESSION_TTL_DAYS = "7"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
