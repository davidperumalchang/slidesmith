services:
  db:
    image: postgres:16-alpine
    container_name: slidesmith-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slidesmith}
      POSTGRES_USER: ${POSTGRES_USER:-slidesmith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - slidesmith_pg_data:/var/lib/postgresql/data
    # Host 5432 is often taken by other local Postgres containers.
    # Format is HOST:CONTAINER — Postgres inside always listens on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: slidesmith-backend
    container_name: slidesmith-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-slidesmith}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-slidesmith}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4001,http://127.0.0.1:4001}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      # Same-origin Next proxy → Lax + Secure=false is correct for local HTTP.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls the Next.js same-origin proxy (keeps the session cookie on-site).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/backend-api}
        # Always the Compose service hostname (do not use localhost from root .env).
        API_INTERNAL_URL: http://backend:4000/api
    image: slidesmith-frontend
    container_name: slidesmith-frontend
    environment:
      NODE_ENV: production
      PORT: 4001
      API_INTERNAL_URL: http://backend:4000/api
    ports:
      - "${FRONTEND_PORT:-4001}:4001"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  slidesmith_pg_data:
