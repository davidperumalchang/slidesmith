services:
  backend:
    build:
      context: ./backend
    image: slidesmith-backend
    container_name: slidesmith-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4001,http://127.0.0.1:4001}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    image: slidesmith-frontend
    container_name: slidesmith-frontend
    environment:
      NODE_ENV: production
      PORT: 4001
    ports:
      - "${FRONTEND_PORT:-4001}:4001"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
